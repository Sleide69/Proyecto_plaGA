services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: plaga_db
      DB_USERNAME: plaga_user
      DB_PASSWORD: plaga_pass
    depends_on:
      - postgres
    volumes:
      - .:/var/www/html

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: plaga_user
      POSTGRES_PASSWORD: plaga_pass
      POSTGRES_DB: plaga_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  script:
      build:
        context: ./scripts
        dockerfile: Dockerfile
      ports:
        - "5000:5000"
      volumes:
        - ./scripts:/usr/src/app
      depends_on:
        - postgres

volumes:
  postgres_data: